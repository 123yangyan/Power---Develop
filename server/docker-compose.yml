services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - api_data:/data
    depends_on:
      - redis
    networks:
      - internal
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 120
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - api_data:/data
    depends_on:
      - redis
      - api
    networks:
      - internal
    command: python -m app.worker

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  redis_data:
  api_data:
